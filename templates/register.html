<!DOCTYPE html>
<html>
<head>
    <title>Apply for Loan</title>
</head>

    <h2>Customer Registration</h2>

    <form action="/customer/register" method="post">
        <label>First Name:</label>
        <input type="text" name="first_name" required><br><br>
        <label>Last Name:</label>
        <input type="text" name="last_name" required><br><br>
        <label>Address:</label>
        <input type="text" name="address" required><br><br>
        <label>Social Security Number:</label>
        <input type="text" name="social_security_number" required><br><br>
        <label>Government ID:</label>
        <input type="text" name="government_ID" required><br><br>
        <label>Email:</label>
        <input type="email" name="email" required><br><br>
        <label>Phone Number:</label>
        <input type="text" name="phone_number" required><br><br>
        <label>Date of Birth:</label>
        <input type="date" name="DOB" required><br><br>
        <label>Credit Score:</label>
        <input type="number" name="credit_score" required><br><br>
        <label>Customer Type:</label>
        <input type="text" name="customer_type" required><br><br>
        <label>Password:</label>
        <input type="password" name="password" required><br><br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
